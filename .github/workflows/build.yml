name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.3'

    - name: Prepare Required Build Files
      run: |
        # Ensure the app directory exists
        mkdir -p app

        # Automatically generate the debug keystore if it doesn't exist
        if [ ! -f app/debug.keystore ]; then
            keytool -genkey -v -keystore app/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug, OU=Development, O=Android, L=Mountain View, ST=California, C=US"
        fi

        # Automatically create google-services.json matching your app's package name
        if [ ! -f app/google-services.json ]; then
            echo '{
  "project_info": {
    "project_number": "1234567890",
    "project_id": "pure-dial-dummy",
    "storage_bucket": "pure-dial-dummy.appspot.com"
  },
  "client": [
    {
      "client_info": {
        "mobilesdk_app_id": "1:1234567890:android:1234567890abcdef",
        "android_client_info": {
          "package_name": "com.aistudio.phonedialer.app"
        }
      },
      "oauth_client": [],
      "api_key": [ { "current_key": "AIzaSyDummyKeyForBuildHelp123456789" } ],
      "services": { "analytics_service": { "status": 1 } }
    }
  ],
  "configuration_version": "1"
}' > app/google-services.json
        fi

    - name: Build Debug APK
      run: gradle assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/*.apk
